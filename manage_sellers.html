
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketly - Manage Sellers</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    color: #172033;
}

header {
    background: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e8eaf1;
}

.logo {
    color: #4f46e5;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.subtitle {
    color: #687386;
    margin: 10px 0 25px;
}

.search {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin-bottom: 20px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e8eaf1;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th, td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f9fafb;
    color: #687386;
}

.status {
    font-weight: bold;
}

.approved {
    color: #15803d;
}

.pending {
    color: #d97706;
}

.rejected {
    color: #dc2626;
}

button {
    padding: 7px 11px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 2px;
}

.approve-btn {
    background: #dcfce7;
    color: #15803d;
}

.reject-btn, .block-btn {
    background: #fee2e2;
    color: #dc2626;
}

.unblock-btn {
    background: #dcfce7;
    color: #15803d;
}

</style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>
    <a href="admin_dashboard.html">← Dashboard</a>
</header>

<main>

    <h1>Manage Sellers 🏪</h1>
    <p class="subtitle">Review seller registrations and manage seller accounts.</p>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search sellers by name or email..."
    >

    <div class="container">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Seller Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Account</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="sellerList"></tbody>
        </table>

        <p id="empty" style="display:none;text-align:center;padding:25px">
            No sellers found.
        </p>

    </div>

</main>

<script>

function getUser() {
    try { return JSON.parse(localStorage.getItem("marketlyUser") || "null"); }
    catch (e) { return null; }
}
const user = getUser();
if (!user || (user.role !== "admin" && user.role !== "superadmin")) { location.href = "login.html"; }

let sellers = [];

async function load() {
    try {
        const res = await fetch("/api/admin/sellers", { headers: { "x-user-id": user.user_id } }).then(r => r.json());
        sellers = res.sellers || [];
    } catch (e) {}
    displaySellers();
}

const statusLabel = s => s === "active" ? "Approved" : s === "pending" ? "Pending" : "Blocked";
const statusClass = s => s === "active" ? "approved" : s === "pending" ? "pending" : "rejected";

function displaySellers() {
    const search = document.getElementById("search").value.toLowerCase();
    const filtered = sellers.filter(s =>
        s.name.toLowerCase().includes(search) || s.email.toLowerCase().includes(search)
    );
    const list = document.getElementById("sellerList");
    document.getElementById("empty").style.display = filtered.length ? "none" : "block";

    list.innerHTML = filtered.map(s => `
        <tr>
            <td>${s.user_id}</td>
            <td>${s.name}</td>
            <td>${s.email}</td>
            <td class="status ${statusClass(s.status)}">${statusLabel(s.status)}</td>
            <td>${s.status === "blocked" ? "Blocked" : "Active"}</td>
            <td>
                ${s.status === "pending"
                    ? `<button class="approve-btn" data-approve="${s.user_id}">Approve</button>
                       <button class="reject-btn" data-reject="${s.user_id}">Reject</button>`
                    : ""}
                ${s.status === "blocked"
                    ? `<button class="unblock-btn" data-unblock="${s.user_id}">Unblock</button>`
                    : `<button class="block-btn" data-block="${s.user_id}">Block</button>`}
            </td>
        </tr>
    `).join("");

    document.querySelectorAll("[data-approve]").forEach(b => b.addEventListener("click", () => act(`/api/admin/sellers/${b.dataset.approve}/approve`)));
    document.querySelectorAll("[data-reject]").forEach(b => b.addEventListener("click", () => act(`/api/admin/sellers/${b.dataset.reject}/reject`)));
    document.querySelectorAll("[data-block]").forEach(b => b.addEventListener("click", () => act(`/api/admin/users/${b.dataset.block}/block`)));
    document.querySelectorAll("[data-unblock]").forEach(b => b.addEventListener("click", () => act(`/api/admin/users/${b.dataset.unblock}/unblock`)));
}

async function act(url) {
    const res = await fetch(url, { method: "PUT", headers: { "x-user-id": user.user_id } }).then(r => r.json());
    if (!res.success) alert(res.message || "Action failed");
    load();
}

document.getElementById("search").addEventListener("input", displaySellers);
load();

</script>

</body>
</html>
