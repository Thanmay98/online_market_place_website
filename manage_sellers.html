
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketly - Manage Sellers</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    color: #172033;
}

header {
    background: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e8eaf1;
}

.logo {
    color: #4f46e5;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.subtitle {
    color: #687386;
    margin: 10px 0 25px;
}

.search {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin-bottom: 20px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e8eaf1;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th, td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f9fafb;
    color: #687386;
}

.status {
    font-weight: bold;
}

.approved {
    color: #15803d;
}

.pending {
    color: #d97706;
}

.rejected {
    color: #dc2626;
}

button {
    padding: 7px 11px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin: 2px;
}

.approve-btn {
    background: #dcfce7;
    color: #15803d;
}

.reject-btn, .block-btn {
    background: #fee2e2;
    color: #dc2626;
}

.unblock-btn {
    background: #dcfce7;
    color: #15803d;
}

</style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>
    <a href="admin_dashboard.html">← Dashboard</a>
</header>

<main>

    <h1>Manage Sellers 🏪</h1>
    <p class="subtitle">Review seller registrations and manage seller accounts.</p>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search sellers by name or email..."
    >

    <div class="container">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Seller Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Account</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="sellerList"></tbody>
        </table>

        <p id="empty" style="display:none;text-align:center;padding:25px">
            No sellers found.
        </p>

    </div>

</main>

<script>

let sellers = [
    {id: 1, name: "Rahul Stores", email: "rahul@gmail.com", status: "Approved", blocked: false},
    {id: 2, name: "Priya Fashion", email: "priya@gmail.com", status: "Pending", blocked: false},
    {id: 3, name: "Tech World", email: "tech@gmail.com", status: "Approved", blocked: true},
    {id: 4, name: "Home Essentials", email: "home@gmail.com", status: "Rejected", blocked: false}
];

function displaySellers() {

    const search = document.getElementById("search").value.toLowerCase();

    const filtered = sellers.filter(s =>
        s.name.toLowerCase().includes(search) ||
        s.email.toLowerCase().includes(search)
    );

    const list = document.getElementById("sellerList");

    list.innerHTML = "";

    document.getElementById("empty").style.display =
        filtered.length ? "none" : "block";

    filtered.forEach(seller => {

        const index = sellers.indexOf(seller);

        list.innerHTML += `
            <tr>
                <td>${seller.id}</td>
                <td>${seller.name}</td>
                <td>${seller.email}</td>

                <td class="status ${seller.status.toLowerCase()}">
                    ${seller.status}
                </td>

                <td>${seller.blocked ? "Blocked" : "Active"}</td>

                <td>
                    ${seller.status === "Pending" ? `
                        <button class="approve-btn" onclick="approveSeller(${index})">Approve</button>
                        <button class="reject-btn" onclick="rejectSeller(${index})">Reject</button>
                    ` : ""}

                    <button class="${seller.blocked ? "unblock-btn" : "block-btn"}"
                        onclick="toggleBlock(${index})">
                        ${seller.blocked ? "Unblock" : "Block"}
                    </button>
                </td>
            </tr>
        `;
    });
}

function approveSeller(index) {
    sellers[index].status = "Approved";
    displaySellers();
}

function rejectSeller(index) {
    sellers[index].status = "Rejected";
    displaySellers();
}

function toggleBlock(index) {
    sellers[index].blocked = !sellers[index].blocked;
    displaySellers();
}

document.getElementById("search").addEventListener("input", displaySellers);

displaySellers();

</script>

</body>
</html>
