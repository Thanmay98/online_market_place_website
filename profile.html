
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketly - My Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f8fc;
            color: #172033;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e8eaf1;
        }

        .logo {
            color: #4f46e5;
            font-size: 25px;
            font-weight: bold;
        }

        header a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #e8eaf1;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #687386;
            margin-bottom: 25px;
        }

        .avatar {
            width: 75px;
            height: 75px;
            background: #eeedff;
            color: #4f46e5;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 30px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #3730a3;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>
    <a href="customer_dashboard.html">← Dashboard</a>
</header>

<div class="container">

    <div class="profile-box">

        <h1>My Profile 👤</h1>
        <p class="subtitle">View and update your personal information.</p>

        <div class="avatar">👤</div>

        <form id="profileForm">

            <label>Full Name</label>
            <input type="text" id="name" value="Customer Name" required>

            <label>Email Address</label>
            <input type="email" id="email" value="customer@example.com" required>

            <label>Mobile Number</label>
            <input type="tel" id="mobile" value="9876543210" required>

            <label>Address</label>
            <input type="text" id="address" placeholder="Enter your address">

            <label>City</label>
            <input type="text" id="city" placeholder="Enter your city">

            <label>Pincode</label>
            <input type="text" id="pincode" placeholder="Enter pincode">

            <button type="submit">Save Changes</button>

            <p id="message"></p>

        </form>

    </div>

</div>

<script>

    document.getElementById("profileForm").addEventListener("submit", function(e) {

        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const mobile = document.getElementById("mobile").value.trim();

        const message = document.getElementById("message");

        if (!name || !email || !mobile) {
            message.style.color = "red";
            message.textContent = "Please fill in all required fields.";
            return;
        }

        if (!/^[0-9]{10}$/.test(mobile)) {
            message.style.color = "red";
            message.textContent = "Enter a valid 10-digit mobile number.";
            return;
        }

        message.style.color = "green";
        message.textContent = "Profile updated successfully!";

    });

</script>

</body>
</html>
