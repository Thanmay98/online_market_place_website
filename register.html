
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketly - Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f8fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-box {
            background: white;
            width: 400px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px #00000012;
        }

        .logo {
            text-align: center;
            color: #4f46e5;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #687386;
            font-size: 14px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 13px 0 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #message {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <div class="logo">marketly.</div>

        <h2>Create Account</h2>
        <p class="subtitle">Join Marketly and start exploring!</p>

        <form id="registerForm">

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Mobile Number</label>
            <input type="tel" id="mobile" placeholder="10-digit mobile number" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Create password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <label>Register As</label>
            <select id="role" required>
                <option value="">Select account type</option>
                <option value="customer">Customer</option>
                <option value="seller">Seller</option>
            </select>

            <button type="submit">Create Account</button>

            <p id="message"></p>

        </form>

        <p class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p class="login">
            <a href="index.html">← Back to Home</a>
        </p>

    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(e) {

            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const role = document.getElementById("role").value;

            const message = document.getElementById("message");

            if (!name || !email || !mobile || !password || !confirmPassword || !role) {
                message.style.color = "red";
                message.textContent = "Please fill in all fields.";
                return;
            }

            if (!/^[0-9]{10}$/.test(mobile)) {
                message.style.color = "red";
                message.textContent = "Enter a valid 10-digit mobile number.";
                return;
            }

            if (password.length < 6) {
                message.style.color = "red";
                message.textContent = "Password must contain at least 6 characters.";
                return;
            }

            if (password !== confirmPassword) {
                message.style.color = "red";
                message.textContent = "Passwords do not match.";
                return;
            }

            try {
                const res = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, mobile, password, role })
                }).then(r => r.json());

                if (!res.success) {
                    message.style.color = "red";
                    message.textContent = res.message || "Registration failed.";
                    return;
                }

                message.style.color = "green";
                message.textContent = role === "seller"
                    ? "Seller account created! An admin must approve it before you can sell. Redirecting to login…"
                    : "Account created! Redirecting to login…";
                setTimeout(() => location.href = "login.html", 1400);
            } catch (err) {
                message.style.color = "red";
                message.textContent = "Could not reach the server.";
            }

        });
    </script>

</body>
</html>
