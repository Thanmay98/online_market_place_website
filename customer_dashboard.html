
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketly - Customer Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f8fc;
            color: #172033;
        }

        header {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e8eaf1;
        }

        .logo {
            color: #4f46e5;
            font-size: 25px;
            font-weight: bold;
        }

        header a {
            text-decoration: none;
            color: #4f46e5;
            margin-left: 18px;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            background: linear-gradient(120deg, #eef2ff, #f5f3ff);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .welcome h1 {
            margin-bottom: 10px;
        }

        .welcome p {
            color: #687386;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 23px;
            border-radius: 12px;
            border: 1px solid #e8eaf1;
        }

        .card h3 {
            color: #687386;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .card h2 {
            color: #4f46e5;
            font-size: 28px;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 22px;
            border: 1px solid #e8eaf1;
        }

        .section h2 {
            margin-bottom: 18px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            background: #4f46e5;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background: #3730a3;
        }

        .order {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .status {
            color: #d97706;
            font-weight: bold;
        }

        @media(max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            header {
                flex-wrap: wrap;
                gap: 12px;
            }

            .order {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="orders.html">My Orders</a>
        <a href="profile.html">Profile</a>
        <a href="#" id="logout">Logout</a>
    </nav>
</header>

<main>

    <div class="welcome">
        <h1 id="welcome">Welcome Back! 👋</h1>
        <p>Manage your orders and discover products you love.</p>
    </div>

    <div class="stats">

        <div class="card">
            <h3>Total Orders</h3>
            <h2 id="totalOrders">0</h2>
        </div>

        <div class="card">
            <h3>Pending Orders</h3>
            <h2 id="pendingOrders">0</h2>
        </div>

        <div class="card">
            <h3>Completed Orders</h3>
            <h2 id="completedOrders">0</h2>
        </div>

    </div>

    <div class="section">
        <h2>Quick Actions</h2>

        <div class="actions">
            <a href="index.html" class="btn">Browse Products</a>
            <a href="orders.html" class="btn">My Orders</a>
            <a href="profile.html" class="btn">My Profile</a>
            <a href="index.html" class="btn">Continue Shopping</a>
        </div>
    </div>

    <div class="section">
        <h2>Recent Orders</h2>

        <div id="recentOrders"></div>

    </div>

</main>

<script>
    function getUser() {
        try { return JSON.parse(localStorage.getItem("marketlyUser") || "null"); }
        catch (e) { return null; }
    }

    const user = getUser();
    if (!user || user.role !== "customer") { location.href = "login.html"; }

    document.getElementById("welcome").textContent = "Welcome back, " + user.name + "! 👋";
    document.getElementById("logout").addEventListener("click", e => {
        e.preventDefault();
        localStorage.removeItem("marketlyUser");
        location.href = "index.html";
    });

    const money = n => "₹" + Number(n || 0).toLocaleString("en-IN");

    async function loadDashboard() {
        let orders = [];
        try {
            const res = await fetch("/api/orders", { headers: { "x-user-id": user.user_id } }).then(r => r.json());
            orders = res.orders || [];
        } catch (e) {}

        document.getElementById("totalOrders").textContent = orders.length;
        document.getElementById("pendingOrders").textContent =
            orders.filter(o => ["pending", "confirmed", "shipped"].includes(o.order_status)).length;
        document.getElementById("completedOrders").textContent =
            orders.filter(o => o.order_status === "delivered").length;

        const recent = document.getElementById("recentOrders");
        recent.innerHTML = orders.length
            ? orders.slice(0, 5).map(o => `
                <div class="order">
                    <span>Order #${o.order_id} · ${money(o.total_amount)} · ${new Date(o.order_date).toLocaleDateString("en-IN")}</span>
                    <span class="status">${o.order_status}</span>
                </div>`).join("")
            : `<div class="order"><span>No orders placed yet.</span><span class="status">No orders</span></div>`;
    }

    loadDashboard();
</script>

</body>
</html>
