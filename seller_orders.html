
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketly - Seller Orders</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    color: #172033;
}

header {
    background: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e8eaf1;
}

.logo {
    color: #4f46e5;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.subtitle {
    color: #687386;
    margin: 10px 0 25px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e8eaf1;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 16px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f9fafb;
    color: #687386;
}

select {
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 7px;
}

.update-btn {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
}

.status {
    font-weight: bold;
    color: #d97706;
}

@media(max-width: 600px) {
    header {
        padding: 18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>
    <a href="seller_dashboard.html">← Dashboard</a>
</header>

<main>

    <h1>Manage Orders 📦</h1>
    <p class="subtitle">View customer orders and update their delivery status.</p>

    <div class="container">

        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Qty</th>
                    <th>Product</th>
                    <th>Amount</th>
                    <th>Order Status</th>
                    <th>Update Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="ordersList"></tbody>
        </table>

    </div>

</main>

<script>

function getUser() {
    try { return JSON.parse(localStorage.getItem("marketlyUser") || "null"); }
    catch (e) { return null; }
}
const user = getUser();
if (!user || user.role !== "seller") { location.href = "login.html"; }

const STATUSES = ["pending", "confirmed", "shipped", "delivered", "cancelled"];

async function displayOrders() {
    const list = document.getElementById("ordersList");
    let lines = [];
    try {
        const res = await fetch("/api/orders/seller", { headers: { "x-user-id": user.user_id } }).then(r => r.json());
        lines = res.items || [];
    } catch (e) {}

    list.innerHTML = lines.length ? lines.map((l, i) => `
        <tr>
            <td>#${l.order_id}</td>
            <td>${l.quantity}</td>
            <td>${l.product_name}</td>
            <td>₹${Number(l.subtotal).toLocaleString("en-IN")}</td>
            <td class="status">${l.order_status}</td>
            <td>
                <select id="status${i}">
                    ${STATUSES.map(s => `<option ${s === l.order_status ? "selected" : ""}>${s}</option>`).join("")}
                </select>
            </td>
            <td>
                <button class="update-btn" data-order="${l.order_id}" data-idx="${i}">Update</button>
            </td>
        </tr>
    `).join("") : `<tr><td colspan="7" style="text-align:center;color:#687386">No orders for your products yet.</td></tr>`;

    document.querySelectorAll("[data-order]").forEach(btn =>
        btn.addEventListener("click", () => updateStatus(Number(btn.dataset.order), btn.dataset.idx)));
}

async function updateStatus(orderId, idx) {
    const status = document.getElementById("status" + idx).value;
    const res = await fetch(`/api/orders/${orderId}/status`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "x-user-id": user.user_id },
        body: JSON.stringify({ order_status: status })
    }).then(r => r.json());
    alert(res.message || (res.success ? "Order status updated" : "Update failed"));
    displayOrders();
}

displayOrders();

</script>

</body>
</html>
