
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketly - Seller Orders</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    color: #172033;
}

header {
    background: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e8eaf1;
}

.logo {
    color: #4f46e5;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.subtitle {
    color: #687386;
    margin: 10px 0 25px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e8eaf1;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 16px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f9fafb;
    color: #687386;
}

select {
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 7px;
}

.update-btn {
    background: #4f46e5;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
}

.status {
    font-weight: bold;
    color: #d97706;
}

@media(max-width: 600px) {
    header {
        padding: 18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>
    <a href="seller_dashboard.html">← Dashboard</a>
</header>

<main>

    <h1>Manage Orders 📦</h1>
    <p class="subtitle">View customer orders and update their delivery status.</p>

    <div class="container">

        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Amount</th>
                    <th>Order Status</th>
                    <th>Update Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="ordersList"></tbody>
        </table>

    </div>

</main>

<script>

let orders = [
    {
        id: 1001,
        customer: "Rahul",
        product: "Wireless Headphones",
        amount: 1499,
        status: "Processing"
    },
    {
        id: 1002,
        customer: "Priya",
        product: "Everyday Backpack",
        amount: 899,
        status: "Shipped"
    },
    {
        id: 1003,
        customer: "Arjun",
        product: "Smart Watch",
        amount: 2199,
        status: "Delivered"
    }
];

function displayOrders() {

    const list = document.getElementById("ordersList");

    list.innerHTML = orders.map((order, index) => `

        <tr>
            <td>#${order.id}</td>
            <td>${order.customer}</td>
            <td>${order.product}</td>
            <td>₹${order.amount}</td>

            <td class="status">${order.status}</td>

            <td>
                <select id="status${index}">
                    <option ${order.status === "Processing" ? "selected" : ""}>Processing</option>
                    <option ${order.status === "Shipped" ? "selected" : ""}>Shipped</option>
                    <option ${order.status === "Delivered" ? "selected" : ""}>Delivered</option>
                </select>
            </td>

            <td>
                <button class="update-btn" onclick="updateStatus(${index})">
                    Update
                </button>
            </td>
        </tr>

    `).join("");

}

function updateStatus(index) {

    const newStatus = document.getElementById("status" + index).value;

    orders[index].status = newStatus;

    displayOrders();

    alert("Order status updated successfully!");

}

displayOrders();

</script>

</body>
</html>
