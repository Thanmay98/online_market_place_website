
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketly - My Products</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    color: #172033;
}

header {
    background: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e8eaf1;
}

.logo {
    color: #4f46e5;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.heading p {
    color: #687386;
    margin-top: 7px;
}

.btn {
    background: #4f46e5;
    color: white;
    padding: 11px 16px;
    border: none;
    border-radius: 8px;
    text-decoration: none;
    cursor: pointer;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e8eaf1;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
}

th, td {
    padding: 16px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    color: #687386;
    background: #f9fafb;
}

.edit {
    background: #eef2ff;
    color: #4f46e5;
    border: none;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.delete {
    background: #fee2e2;
    color: #dc2626;
    border: none;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.stock {
    color: #15803d;
    font-weight: bold;
}

@media(max-width: 600px) {
    .heading {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>
    <a href="seller_dashboard.html">← Dashboard</a>
</header>

<main>

    <div class="heading">
        <div>
            <h1>My Products 📦</h1>
            <p>Manage your product listings and inventory.</p>
        </div>

        <a href="add_product.html" class="btn">+ Add Product</a>
    </div>

    <div class="container">

        <table>
            <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="productList"></tbody>
        </table>

    </div>

</main>

<script>

function getUser() {
    try { return JSON.parse(localStorage.getItem("marketlyUser") || "null"); }
    catch (e) { return null; }
}
const user = getUser();
if (!user || user.role !== "seller") { location.href = "login.html"; }

async function displayProducts() {
    const list = document.getElementById("productList");
    let products = [];
    try {
        const res = await fetch("/api/products/mine", { headers: { "x-user-id": user.user_id } }).then(r => r.json());
        products = res.products || [];
    } catch (e) {}

    list.innerHTML = products.length ? products.map(p => `
        <tr>
            <td>${p.product_id}</td>
            <td>${p.product_name}</td>
            <td>${p.category_name}</td>
            <td>₹${Number(p.price).toLocaleString("en-IN")}</td>
            <td class="stock">${p.stock_quantity}</td>
            <td>
                <button class="edit" data-edit="${p.product_id}" data-price="${p.price}" data-stock="${p.stock_quantity}">Edit</button>
                <button class="delete" data-del="${p.product_id}">Delete</button>
            </td>
        </tr>
    `).join("") : `<tr><td colspan="6" style="text-align:center;color:#687386">No products yet — add one!</td></tr>`;

    document.querySelectorAll("[data-edit]").forEach(b =>
        b.addEventListener("click", () => editProduct(Number(b.dataset.edit), b.dataset.price, b.dataset.stock)));
    document.querySelectorAll("[data-del]").forEach(b =>
        b.addEventListener("click", () => deleteProduct(Number(b.dataset.del))));
}

async function editProduct(id, curPrice, curStock) {
    const newPrice = prompt("Enter new price:", curPrice);
    if (newPrice === null) return;
    const price = Number(newPrice);
    if (!Number.isFinite(price) || price < 0) { alert("Enter a valid price."); return; }

    const newStock = prompt("Enter new stock quantity:", curStock);
    if (newStock === null) return;
    const stock = Number(newStock);
    if (!Number.isInteger(stock) || stock < 0) { alert("Enter a valid stock quantity."); return; }

    const res = await fetch(`/api/products/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "x-user-id": user.user_id },
        body: JSON.stringify({ price, stock_quantity: stock })
    }).then(r => r.json());
    alert(res.message || (res.success ? "Product updated" : "Update failed"));
    displayProducts();
}

async function deleteProduct(id) {
    if (!confirm("Are you sure you want to delete this product?")) return;
    const res = await fetch(`/api/products/${id}`, {
        method: "DELETE", headers: { "x-user-id": user.user_id }
    }).then(r => r.json());
    alert(res.message || (res.success ? "Product deleted" : "Delete failed"));
    displayProducts();
}

displayProducts();

</script>

</body>
</html>
