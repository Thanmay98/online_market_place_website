
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketly - My Products</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    color: #172033;
}

header {
    background: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e8eaf1;
}

.logo {
    color: #4f46e5;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.heading p {
    color: #687386;
    margin-top: 7px;
}

.btn {
    background: #4f46e5;
    color: white;
    padding: 11px 16px;
    border: none;
    border-radius: 8px;
    text-decoration: none;
    cursor: pointer;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e8eaf1;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 600px;
}

th, td {
    padding: 16px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    color: #687386;
    background: #f9fafb;
}

.edit {
    background: #eef2ff;
    color: #4f46e5;
    border: none;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.delete {
    background: #fee2e2;
    color: #dc2626;
    border: none;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.stock {
    color: #15803d;
    font-weight: bold;
}

@media(max-width: 600px) {
    .heading {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>
    <a href="seller_dashboard.html">← Dashboard</a>
</header>

<main>

    <div class="heading">
        <div>
            <h1>My Products 📦</h1>
            <p>Manage your product listings and inventory.</p>
        </div>

        <a href="add_product.html" class="btn">+ Add Product</a>
    </div>

    <div class="container">

        <table>
            <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="productList"></tbody>
        </table>

    </div>

</main>

<script>

let products = [
    {id: 101, name: "Wireless Headphones", category: "Electronics", price: 1499, stock: 20},
    {id: 102, name: "Everyday Backpack", category: "Accessories", price: 899, stock: 15},
    {id: 103, name: "Smart Watch", category: "Electronics", price: 2199, stock: 8},
    {id: 104, name: "Classic Sneakers", category: "Fashion", price: 1299, stock: 12}
];

function displayProducts() {

    const list = document.getElementById("productList");

    list.innerHTML = products.map((p, index) => `
        <tr>
            <td>${p.id}</td>
            <td>${p.name}</td>
            <td>${p.category}</td>
            <td>₹${p.price}</td>
            <td class="stock">${p.stock}</td>
            <td>
                <button class="edit" onclick="editProduct(${index})">Edit</button>
                <button class="delete" onclick="deleteProduct(${index})">Delete</button>
            </td>
        </tr>
    `).join("");
}

function editProduct(index) {

    let product = products[index];

    let newPrice = prompt("Enter new price:", product.price);

    if (newPrice === null) return;

    let price = Number(newPrice);

    if (!Number.isFinite(price) || price <= 0) {
        alert("Enter a valid price.");
        return;
    }

    let newStock = prompt("Enter new stock quantity:", product.stock);

    if (newStock === null) return;

    let stock = Number(newStock);

    if (!Number.isInteger(stock) || stock < 0) {
        alert("Enter a valid stock quantity.");
        return;
    }

    product.price = price;
    product.stock = stock;

    displayProducts();

    alert("Product updated successfully!");
}

function deleteProduct(index) {

    if (confirm("Are you sure you want to delete this product?")) {

        products.splice(index, 1);

        displayProducts();

        alert("Product deleted successfully!");
    }
}

displayProducts();

</script>

</body>
</html>
