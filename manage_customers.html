
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketly - Manage Customers</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    color: #172033;
}

header {
    background: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e8eaf1;
}

.logo {
    color: #4f46e5;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.subtitle {
    color: #687386;
    margin: 10px 0 25px;
}

.search {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin-bottom: 20px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e8eaf1;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f9fafb;
    color: #687386;
}

.status {
    font-weight: bold;
}

.active {
    color: #15803d;
}

.blocked {
    color: #dc2626;
}

.action {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #fee2e2;
    color: #dc2626;
}

.unblock {
    background: #dcfce7;
    color: #15803d;
}

@media(max-width: 600px) {
    header {
        padding: 18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>
    <a href="admin_dashboard.html">← Dashboard</a>
</header>

<main>

    <h1>Manage Customers 👥</h1>
    <p class="subtitle">View, search and manage registered customers.</p>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search customers by name or email..."
    >

    <div class="container">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="customerList"></tbody>
        </table>

        <p id="empty" style="display:none; text-align:center; padding:25px;">
            No customers found.
        </p>

    </div>

</main>

<script>

function getUser() {
    try { return JSON.parse(localStorage.getItem("marketlyUser") || "null"); }
    catch (e) { return null; }
}
const user = getUser();
if (!user || (user.role !== "admin" && user.role !== "superadmin")) { location.href = "login.html"; }

let customers = [];

async function load() {
    try {
        const res = await fetch("/api/admin/customers", { headers: { "x-user-id": user.user_id } }).then(r => r.json());
        customers = res.customers || [];
    } catch (e) {}
    displayCustomers();
}

function displayCustomers() {
    const search = document.getElementById("search").value.toLowerCase();
    const filtered = customers.filter(c =>
        c.name.toLowerCase().includes(search) || c.email.toLowerCase().includes(search)
    );
    const list = document.getElementById("customerList");
    document.getElementById("empty").style.display = filtered.length ? "none" : "block";

    list.innerHTML = filtered.map(c => `
        <tr>
            <td>${c.user_id}</td>
            <td>${c.name}</td>
            <td>${c.email}</td>
            <td>${c.mobile || "—"}</td>
            <td class="status ${c.status === "active" ? "active" : "blocked"}">${c.status}</td>
            <td>
                <button class="action ${c.status === "blocked" ? "unblock" : ""}"
                        data-id="${c.user_id}" data-status="${c.status}">
                    ${c.status === "active" ? "Block" : "Unblock"}
                </button>
            </td>
        </tr>
    `).join("");

    document.querySelectorAll("[data-id]").forEach(b =>
        b.addEventListener("click", () => toggleStatus(Number(b.dataset.id), b.dataset.status)));
}

async function toggleStatus(id, status) {
    const action = status === "active" ? "block" : "unblock";
    const res = await fetch(`/api/admin/users/${id}/${action}`, {
        method: "PUT", headers: { "x-user-id": user.user_id }
    }).then(r => r.json());
    if (!res.success) alert(res.message || "Action failed");
    load();
}

document.getElementById("search").addEventListener("input", displayCustomers);
load();

</script>

</body>
</html>
