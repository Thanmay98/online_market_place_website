
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Admins | Marketly</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f1f5f9; color: #1e293b; }
        header { background: #0f172a; color: white; padding: 20px 5%; }
        header a { color: white; text-decoration: none; }
        main { max-width: 1100px; margin: 35px auto; padding: 20px; }
        h1 { margin-bottom: 10px; }
        .subtitle { color: #64748b; margin-bottom: 22px; }
        .form-box, .table-box { background: white; padding: 22px; border-radius: 12px; margin-bottom: 22px; }
        input { padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 8px 5px 8px 0; }
        button { padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer; color: white; background: #2563eb; }
        .delete { background: #dc2626; }
        .block { background: #d97706; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 13px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background: #eff6ff; }
        .status { font-weight: bold; }
        @media(max-width: 650px) { .table-box { overflow-x: auto; } input { width: 100%; } }
    </style>
</head>
<body>
    <header>
        <a href="superadmin_dashboard.html">← Back to Super Admin Dashboard</a>
    </header>

    <main>
        <h1>Manage Administrators</h1>
        <p class="subtitle">Add, view and manage marketplace administrators.</p>

        <div class="form-box">
            <h3>Add New Administrator</h3>
            <form id="adminForm">
                <input type="text" id="adminName" placeholder="Administrator name" required>
                <input type="email" id="adminEmail" placeholder="Email address" required>
                <button type="submit">Add Administrator</button>
            </form>
        </div>

        <div class="table-box">
            <h3>Administrator List</h3>
            <input type="text" id="search" placeholder="Search administrators..." oninput="searchAdmins()">

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminTable">
                    <tr>
                        <td>Arun Kumar</td>
                        <td>arun@marketly.com</td>
                        <td class="status">Active</td>
                        <td><button class="block" onclick="toggleStatus(this)">Disable</button></td>
                    </tr>
                    <tr>
                        <td>Priya Sharma</td>
                        <td>priya@marketly.com</td>
                        <td class="status">Active</td>
                        <td><button class="block" onclick="toggleStatus(this)">Disable</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const form = document.getElementById("adminForm");
        const table = document.getElementById("adminTable");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("adminName").value.trim();
            const email = document.getElementById("adminEmail").value.trim();

            if (!name || !email) {
                alert("Please fill in all fields.");
                return;
            }

            const row = table.insertRow();
            row.innerHTML = `
                <td>${escapeHTML(name)}</td>
                <td>${escapeHTML(email)}</td>
                <td class="status">Active</td>
                <td><button class="block" onclick="toggleStatus(this)">Disable</button></td>
            `;

            form.reset();
        });

        function toggleStatus(button) {
            const status = button.closest("tr").querySelector(".status");

            if (status.textContent === "Active") {
                status.textContent = "Disabled";
                button.textContent = "Enable";
            } else {
                status.textContent = "Active";
                button.textContent = "Disable";
            }
        }

        function searchAdmins() {
            const query = document.getElementById("search").value.toLowerCase();

            Array.from(table.rows).forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(query) ? "" : "none";
            });
        }

        function escapeHTML(value) {
            return value.replace(/[&<>"']/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;",
                '"': "&quot;", "'": "&#39;"
            })[char]);
        }
    </script>
</body>
</html>
