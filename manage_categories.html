
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketly - Manage Categories</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    color: #172033;
}

header {
    background: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e8eaf1;
}

.logo {
    color: #4f46e5;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 20px;
}

.subtitle {
    color: #687386;
    margin: 10px 0 25px;
}

.form-box, .table-box {
    background: white;
    padding: 25px;
    border: 1px solid #e8eaf1;
    border-radius: 12px;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 12px 0 7px;
    font-weight: bold;
}

input, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
}

textarea {
    resize: vertical;
    min-height: 70px;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    margin-top: 12px;
}

.add-btn {
    background: #4f46e5;
    color: white;
    width: 100%;
}

.edit-btn {
    background: #eef2ff;
    color: #4f46e5;
}

.delete-btn {
    background: #fee2e2;
    color: #dc2626;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 14px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f9fafb;
    color: #687386;
}

#message {
    margin-top: 12px;
    font-size: 14px;
}

@media(max-width: 600px) {
    .table-box {
        overflow-x: auto;
    }

    table {
        min-width: 500px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>
    <a href="admin_dashboard.html">← Dashboard</a>
</header>

<main>

    <h1>Manage Categories 📂</h1>
    <p class="subtitle">Add, edit and delete product categories.</p>

    <div class="form-box">

        <h2 id="formTitle">Add New Category</h2>

        <form id="categoryForm">

            <label>Category Name</label>
            <input type="text" id="categoryName"
                   placeholder="Enter category name" required>

            <label>Description</label>
            <textarea id="description"
                      placeholder="Enter category description"></textarea>

            <button type="submit" class="add-btn" id="submitBtn">
                Add Category
            </button>

            <button type="button" id="cancelBtn"
                    onclick="resetForm()" style="display:none">
                Cancel Edit
            </button>

            <p id="message"></p>

        </form>

    </div>

    <div class="table-box">

        <h2>Existing Categories</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Category Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="categoryList"></tbody>
        </table>

    </div>

</main>

<script>

function getUser() {
    try { return JSON.parse(localStorage.getItem("marketlyUser") || "null"); }
    catch (e) { return null; }
}
const user = getUser();
if (!user || (user.role !== "admin" && user.role !== "superadmin")) { location.href = "login.html"; }

let categories = [];
let editId = null;

async function load() {
    try {
        const res = await fetch("/api/categories", { headers: { "x-user-id": user.user_id } }).then(r => r.json());
        categories = res.categories || [];
    } catch (e) {}
    displayCategories();
}

function displayCategories() {
    document.getElementById("categoryList").innerHTML = categories.map(c => `
        <tr>
            <td>${c.category_id}</td>
            <td>${c.category_name}</td>
            <td>${c.description || ""}</td>
            <td>
                <button class="edit-btn" data-edit="${c.category_id}">Edit</button>
                <button class="delete-btn" data-del="${c.category_id}">Delete</button>
            </td>
        </tr>
    `).join("");
    document.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => editCategory(Number(b.dataset.edit))));
    document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => deleteCategory(Number(b.dataset.del))));
}

document.getElementById("categoryForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const name = document.getElementById("categoryName").value.trim();
    const description = document.getElementById("description").value.trim();
    const message = document.getElementById("message");

    if (!name) { message.style.color = "red"; message.textContent = "Enter a category name."; return; }

    let res;
    try {
        if (editId === null) {
            res = await fetch("/api/categories", {
                method: "POST",
                headers: { "Content-Type": "application/json", "x-user-id": user.user_id },
                body: JSON.stringify({ category_name: name, description })
            }).then(r => r.json());
        } else {
            res = await fetch(`/api/categories/${editId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "x-user-id": user.user_id },
                body: JSON.stringify({ category_name: name, description })
            }).then(r => r.json());
        }
    } catch (err) { message.style.color = "red"; message.textContent = "Server error."; return; }

    if (!res.success) { message.style.color = "red"; message.textContent = res.message || "Failed."; return; }
    message.style.color = "green";
    message.textContent = editId === null ? "Category added successfully!" : "Category updated successfully!";
    resetForm();
    load();
});

function editCategory(id) {
    const c = categories.find(x => x.category_id === id);
    if (!c) return;
    editId = id;
    document.getElementById("categoryName").value = c.category_name;
    document.getElementById("description").value = c.description || "";
    document.getElementById("formTitle").textContent = "Edit Category";
    document.getElementById("submitBtn").textContent = "Update Category";
    document.getElementById("cancelBtn").style.display = "inline-block";
    document.getElementById("message").textContent = "";
}

async function deleteCategory(id) {
    if (!confirm("Are you sure you want to delete this category?")) return;
    const res = await fetch(`/api/categories/${id}`, {
        method: "DELETE", headers: { "x-user-id": user.user_id }
    }).then(r => r.json());
    if (!res.success) alert(res.message || "Delete failed");
    load();
}

function resetForm() {
    editId = null;
    document.getElementById("categoryForm").reset();
    document.getElementById("formTitle").textContent = "Add New Category";
    document.getElementById("submitBtn").textContent = "Add Category";
    document.getElementById("cancelBtn").style.display = "none";
}

load();

</script>

</body>
</html>
