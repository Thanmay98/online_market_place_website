
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Reports | Marketly</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f4f6fb; color: #222; }
        header { background: #172554; color: white; padding: 20px 5%; }
        header a { color: white; text-decoration: none; }
        main { max-width: 1100px; margin: 35px auto; padding: 20px; }
        h1 { margin-bottom: 8px; }
        .subtitle { color: #64748b; margin-bottom: 25px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px; }
        .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 3px 12px #0000000c; }
        .card p { color: #64748b; margin-bottom: 12px; }
        .card h2 { color: #1d4ed8; }
        .section { background: white; padding: 22px; margin-top: 25px; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 13px; border-bottom: 1px solid #e2e8f0; text-align: left; }
        th { background: #eff6ff; }
        button { background: #1d4ed8; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
        @media(max-width: 600px) { main { margin: 15px auto; } .section { overflow-x: auto; } }
    </style>
</head>
<body>
    <header>
        <a href="admin_dashboard.html">← Back to Admin Dashboard</a>
    </header>

    <main>
        <h1>Marketplace Reports</h1>
        <p class="subtitle">Overview of marketplace performance and activity.</p>

        <div class="cards">
            <div class="card">
                <p>Total Revenue</p>
                <h2 id="repRevenue">₹0</h2>
            </div>
            <div class="card">
                <p>Total Orders</p>
                <h2 id="repOrders">0</h2>
            </div>
            <div class="card">
                <p>Total Customers</p>
                <h2 id="repCustomers">0</h2>
            </div>
            <div class="card">
                <p>Active Sellers</p>
                <h2 id="repSellers">0</h2>
            </div>
        </div>

        <div class="section">
            <h2>Orders by Status</h2>
            <table>
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Count</th>
                    </tr>
                </thead>
                <tbody id="reportTable"></tbody>
            </table>
            <br>
            <button onclick="downloadReport()">Download Report</button>
        </div>
    </main>

    <script>
        function getUser() {
            try { return JSON.parse(localStorage.getItem("marketlyUser") || "null"); }
            catch (e) { return null; }
        }
        const user = getUser();
        if (!user || (user.role !== "admin" && user.role !== "superadmin")) { location.href = "login.html"; }

        const money = n => "₹" + Number(n || 0).toLocaleString("en-IN");

        async function loadReports() {
            try {
                const rep = await fetch("/api/admin/reports", { headers: { "x-user-id": user.user_id } }).then(r => r.json());
                const r = rep.report || {};
                document.getElementById("repRevenue").textContent = money(r.total_revenue);
                document.getElementById("repOrders").textContent = r.total_orders ?? 0;
                document.getElementById("repCustomers").textContent = r.total_customers ?? 0;
                document.getElementById("repSellers").textContent = r.total_sellers ?? 0;
                const rows = r.orders_by_status || [];
                document.getElementById("reportTable").innerHTML = rows.length
                    ? rows.map(s => `<tr><td>${s.order_status}</td><td>${s.count}</td></tr>`).join("")
                    : `<tr><td colspan="2" style="text-align:center;color:#64748b">No orders yet.</td></tr>`;
            } catch (e) {}
        }

        function downloadReport() {
            const rows = [["Status", "Count"]];
            document.querySelectorAll("#reportTable tr").forEach(tr => {
                const tds = tr.querySelectorAll("td");
                if (tds.length >= 2) rows.push([tds[0].textContent, tds[1].textContent]);
            });
            const csv = rows.map(row => row.join(",")).join("\n");
            const blob = new Blob([csv], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "marketly-admin-report.csv";
            link.click();
            URL.revokeObjectURL(url);
        }

        loadReports();
    </script>
</body>
</html>
