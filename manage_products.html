
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketly - Manage Products</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    color: #172033;
}

header {
    background: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e8eaf1;
}

.logo {
    color: #4f46e5;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.subtitle {
    color: #687386;
    margin: 10px 0 25px;
}

.search {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin-bottom: 20px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e8eaf1;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f9fafb;
    color: #687386;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.edit {
    background: #eef2ff;
    color: #4f46e5;
}

.delete {
    background: #fee2e2;
    color: #dc2626;
}

.active {
    color: #15803d;
    font-weight: bold;
}

.inactive {
    color: #dc2626;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>
    <a href="admin_dashboard.html">← Dashboard</a>
</header>

<main>

    <h1>Manage Products 📦</h1>
    <p class="subtitle">View, search, update and remove marketplace products.</p>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search products by name or category..."
    >

    <div class="container">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Seller</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="productList"></tbody>
        </table>

        <p id="empty" style="display:none;text-align:center;padding:25px">
            No products found.
        </p>

    </div>

</main>

<script>

function getUser() {
    try { return JSON.parse(localStorage.getItem("marketlyUser") || "null"); }
    catch (e) { return null; }
}
const user = getUser();
if (!user || (user.role !== "admin" && user.role !== "superadmin")) { location.href = "login.html"; }

let products = [];

async function load() {
    try {
        const res = await fetch("/api/products").then(r => r.json());
        products = res.products || [];
    } catch (e) {}
    displayProducts();
}

function displayProducts() {
    const search = document.getElementById("search").value.toLowerCase();
    const filtered = products.filter(p =>
        p.product_name.toLowerCase().includes(search) || (p.category_name || "").toLowerCase().includes(search)
    );
    const list = document.getElementById("productList");
    document.getElementById("empty").style.display = filtered.length ? "none" : "block";

    list.innerHTML = filtered.map(p => `
        <tr>
            <td>${p.product_id}</td>
            <td>${p.product_name}</td>
            <td>${p.category_name}</td>
            <td>#${p.seller_id}</td>
            <td>₹${Number(p.price).toLocaleString("en-IN")}</td>
            <td class="${p.status}">${p.status}</td>
            <td>
                <button class="edit" data-edit="${p.product_id}" data-price="${p.price}" data-status="${p.status}">Edit</button>
                <button class="delete" data-del="${p.product_id}">Delete</button>
            </td>
        </tr>
    `).join("");

    document.querySelectorAll("[data-edit]").forEach(b =>
        b.addEventListener("click", () => editProduct(Number(b.dataset.edit), b.dataset.price, b.dataset.status)));
    document.querySelectorAll("[data-del]").forEach(b =>
        b.addEventListener("click", () => deleteProduct(Number(b.dataset.del))));
}

async function editProduct(id, curPrice, curStatus) {
    const newPrice = prompt("Enter new product price:", curPrice);
    if (newPrice === null) return;
    const price = Number(newPrice);
    if (!Number.isFinite(price) || price < 0) { alert("Enter a valid price."); return; }

    const toggle = confirm(`Price will be updated.\n\nClick OK to also TOGGLE status (currently ${curStatus}), or Cancel to keep it.`);
    const body = { price };
    if (toggle) body.status = curStatus === "active" ? "inactive" : "active";

    const res = await fetch(`/api/products/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "x-user-id": user.user_id },
        body: JSON.stringify(body)
    }).then(r => r.json());
    alert(res.message || (res.success ? "Product updated" : "Update failed"));
    load();
}

async function deleteProduct(id) {
    if (!confirm("Are you sure you want to delete this product?")) return;
    const res = await fetch(`/api/products/${id}`, {
        method: "DELETE", headers: { "x-user-id": user.user_id }
    }).then(r => r.json());
    alert(res.message || (res.success ? "Product deleted" : "Delete failed"));
    load();
}

document.getElementById("search").addEventListener("input", displayProducts);
load();

</script>

</body>
</html>
