
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketly - Manage Products</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    color: #172033;
}

header {
    background: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #e8eaf1;
}

.logo {
    color: #4f46e5;
    font-size: 25px;
    font-weight: bold;
}

header a {
    color: #4f46e5;
    text-decoration: none;
    font-weight: bold;
}

main {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.subtitle {
    color: #687386;
    margin: 10px 0 25px;
}

.search {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 9px;
    margin-bottom: 20px;
}

.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #e8eaf1;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #eee;
}

th {
    background: #f9fafb;
    color: #687386;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.edit {
    background: #eef2ff;
    color: #4f46e5;
}

.delete {
    background: #fee2e2;
    color: #dc2626;
}

.active {
    color: #15803d;
    font-weight: bold;
}

.inactive {
    color: #dc2626;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <div class="logo">marketly.</div>
    <a href="admin_dashboard.html">← Dashboard</a>
</header>

<main>

    <h1>Manage Products 📦</h1>
    <p class="subtitle">View, search, update and remove marketplace products.</p>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="Search products by name or category..."
    >

    <div class="container">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Seller</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="productList"></tbody>
        </table>

        <p id="empty" style="display:none;text-align:center;padding:25px">
            No products found.
        </p>

    </div>

</main>

<script>

let products = [
    {id: 101, name: "Wireless Headphones", category: "Electronics", seller: "Rahul Stores", price: 1499, status: "Active"},
    {id: 102, name: "Everyday Backpack", category: "Accessories", seller: "Priya Fashion", price: 899, status: "Active"},
    {id: 103, name: "Smart Watch", category: "Electronics", seller: "Tech World", price: 2199, status: "Inactive"},
    {id: 104, name: "Classic Sneakers", category: "Fashion", seller: "Urban Store", price: 1299, status: "Active"}
];

function displayProducts() {

    const search = document.getElementById("search").value.toLowerCase();

    const filtered = products.filter(p =>
        p.name.toLowerCase().includes(search) ||
        p.category.toLowerCase().includes(search)
    );

    const list = document.getElementById("productList");

    list.innerHTML = "";

    document.getElementById("empty").style.display =
        filtered.length ? "none" : "block";

    filtered.forEach(product => {

        const index = products.indexOf(product);

        list.innerHTML += `
            <tr>
                <td>${product.id}</td>
                <td>${product.name}</td>
                <td>${product.category}</td>
                <td>${product.seller}</td>
                <td>₹${product.price}</td>

                <td class="${product.status.toLowerCase()}">
                    ${product.status}
                </td>

                <td>
                    <button class="edit" onclick="editProduct(${index})">
                        Edit
                    </button>

                    <button class="delete" onclick="deleteProduct(${index})">
                        Delete
                    </button>
                </td>
            </tr>
        `;
    });
}

function editProduct(index) {

    const newPrice = prompt("Enter new product price:", products[index].price);

    if (newPrice === null) return;

    const price = Number(newPrice);

    if (!Number.isFinite(price) || price <= 0) {
        alert("Enter a valid price.");
        return;
    }

    products[index].price = price;

    products[index].status =
        products[index].status === "Active" ? "Inactive" : "Active";

    displayProducts();

    alert("Product updated successfully!");
}

function deleteProduct(index) {

    if (confirm("Are you sure you want to delete this product?")) {

        products.splice(index, 1);

        displayProducts();

        alert("Product deleted successfully!");
    }
}

document.getElementById("search").addEventListener("input", displayProducts);

displayProducts();

</script>

</body>
</html>
