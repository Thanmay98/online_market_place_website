
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings | Marketly</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f1f5f9; color: #1e293b; }
        header { background: #0f172a; color: white; padding: 20px 5%; }
        header a { color: white; text-decoration: none; }
        main { max-width: 850px; margin: 35px auto; padding: 20px; }
        h1 { margin-bottom: 8px; }
        .subtitle { color: #64748b; margin-bottom: 22px; }
        .panel { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; }
        .field { margin: 18px 0; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .toggle { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin: 20px 0; }
        .toggle input { width: 20px; height: 20px; }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; }
        #message { color: green; margin-top: 15px; }
    </style>
</head>
<body>
    <header>
        <a href="superadmin_dashboard.html">← Back to Super Admin Dashboard</a>
    </header>

    <main>
        <h1>System Settings</h1>
        <p class="subtitle">Configure basic Marketly marketplace preferences.</p>

        <div class="panel">
            <h3>General Settings</h3>

            <form id="settingsForm">
                <div class="field">
                    <label for="siteName">Marketplace Name</label>
                    <input type="text" id="siteName" value="Marketly" required>
                </div>

                <div class="field">
                    <label for="supportEmail">Support Email</label>
                    <input type="email" id="supportEmail" value="support@marketly.com" required>
                </div>

                <div class="field">
                    <label for="currency">Default Currency</label>
                    <select id="currency">
                        <option value="INR">Indian Rupee (INR)</option>
                        <option value="USD">US Dollar (USD)</option>
                        <option value="EUR">Euro (EUR)</option>
                    </select>
                </div>

                <div class="field">
                    <label for="commission">Seller Commission (%)</label>
                    <input type="number" id="commission" min="0" max="100" value="5" required>
                </div>

                <div class="toggle">
                    <span>Allow new customer registrations</span>
                    <input type="checkbox" id="registration" checked>
                </div>

                <div class="toggle">
                    <span>Enable maintenance mode</span>
                    <input type="checkbox" id="maintenance">
                </div>

                <button type="submit">Save Settings</button>
                <p id="message"></p>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById("settingsForm");

        function loadSettings() {
            const saved = JSON.parse(localStorage.getItem("marketlySettings") || "null");

            if (!saved) return;

            document.getElementById("siteName").value = saved.siteName;
            document.getElementById("supportEmail").value = saved.supportEmail;
            document.getElementById("currency").value = saved.currency;
            document.getElementById("commission").value = saved.commission;
            document.getElementById("registration").checked = saved.registration;
            document.getElementById("maintenance").checked = saved.maintenance;
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const settings = {
                siteName: document.getElementById("siteName").value.trim(),
                supportEmail: document.getElementById("supportEmail").value.trim(),
                currency: document.getElementById("currency").value,
                commission: document.getElementById("commission").value,
                registration: document.getElementById("registration").checked,
                maintenance: document.getElementById("maintenance").checked
            };

            localStorage.setItem("marketlySettings", JSON.stringify(settings));
            document.getElementById("message").textContent = "Settings saved successfully!";
        });

        loadSettings();
    </script>
</body>
</html>
